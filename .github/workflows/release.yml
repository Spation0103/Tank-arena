name: Publish and deploy

on:
  push:
    tags:
      - "v*"
      - "lab-08"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      DEPLOY_WEBHOOK_CONFIGURED: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.ref_name }}
      - name: Deploy through hosting webhook
        if: ${{ env.DEPLOY_WEBHOOK_CONFIGURED == 'true' }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
        run: |
          headers=(-H "Content-Type: application/json")
          if [ -n "${DEPLOY_WEBHOOK_TOKEN:-}" ]; then
            headers+=(-H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN")
          fi
          curl --fail --silent --show-error --retry 3 \
            -X POST "$DEPLOY_WEBHOOK_URL" \
            "${headers[@]}" \
            --data "{\"image\":\"$IMAGE\",\"buildSha\":\"${GITHUB_REF_NAME}\"}"
